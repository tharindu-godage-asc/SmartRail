server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # For the container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed assets can be cached for a long time; the page itself never, so a new build reaches a running display.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Every display address (/display/platform/GPH/1 and so on) is the one page; the router in it reads the address.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    try_files $uri /display.html;
  }
}
