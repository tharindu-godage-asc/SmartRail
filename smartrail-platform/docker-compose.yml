# Local "local" environment (separate from the cluster's dev): API + Postgres + observability stack.
# Start:  docker compose up --build        Grafana: http://localhost:3000   API: http://localhost:8080
services:
  api:
    build: { context: ., dockerfile: src/SmartRail.Api/Dockerfile }
    environment:
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Runtime connection: the smartrail_app role (DML only). Migrations use the admin user. Development-only passwords.
      ConnectionStrings__Smartrail: "Host=postgres;Port=5432;Database=smartrail;Username=smartrail_app;Password=smartrail-app-dev-only;Gss Encryption Mode=Disable"
      ConnectionStrings__SmartrailMigrations: "Host=postgres;Port=5432;Database=smartrail;Username=smartrail;Password=smartrail-dev-only;Gss Encryption Mode=Disable"
      # Only this stack applies migrations and loads the demo journey on startup; the cluster and prod never set these.
      Database__ApplyMigrationsOnStartup: "true"
      Seeding__DemoData: "true"
      # Token validation. Tokens say http://localhost:8180 (the issuer); the API fetches the keys from inside the Compose network.
      Authentication__Authority: http://localhost:8180/realms/smartrail
      Authentication__MetadataAddress: http://keycloak:8080/realms/smartrail/.well-known/openid-configuration
      Authentication__Audience: smartrail-api
      Authentication__RequireHttpsMetadata: "false"
      # Compose only: exposes GET /api/v1/whoami for manual testing.
      Diagnostics__WhoAmI: "true"
    ports: ["8080:8080"]
    # If the database is still unreachable the API exits and is restarted (no retry loop in the code).
    restart: on-failure
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
      # Started, not healthy: the API fetches the discovery document on first use, so a slow Keycloak does not block it.
      keycloak: { condition: service_started }
  postgres:
    # PostgreSQL 13 or later is required (gen_random_uuid() is built in from 13).
    image: postgres:17
    environment: { POSTGRES_USER: smartrail, POSTGRES_PASSWORD: smartrail-dev-only, POSTGRES_DB: smartrail }
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a brand-new volume: creates the roles, the keycloak database and the default privileges.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary server used while the init scripts run listens on the socket only,
      # so the check passes only once the real server is up and the scripts are done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smartrail -d smartrail"]
      interval: 5s
      timeout: 3s
      retries: 12
  keycloak:
    # Development mode only (start-dev): plain HTTP, no production hardening (spec keycloak-identity, deferred decision D2).
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev-only
      # The one public address tokens are issued for (the "issuer"). Containers reach Keycloak at http://keycloak:8080, but
      # tokens must still say http://localhost:8180, so the backchannel setting lets the internal address serve its own URLs.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Development-only console admin.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
    volumes:
      # The realm file is the source of truth. It is imported only when the realm does not exist yet (fresh keycloak database).
      - ./docker/keycloak/realm-smartrail.json:/opt/keycloak/data/import/realm-smartrail.json:ro
    ports: ["8180:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # The image has no curl; bash can open a TCP connection to the management port (9000) and read the status line.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    ports: ["4317:4317"]
    volumes: ["./observability/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    depends_on: [prometheus, loki, tempo]
  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro"]
  grafana:
    image: grafana/grafana:latest
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin }
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
volumes:
  pgdata:
