receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  resource/loki:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name, deployment.environment
exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion: { enabled: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
service:
  pipelines:
    metrics: { receivers: [otlp], processors: [batch], exporters: [prometheusremotewrite] }
    logs: { receivers: [otlp], processors: [resource/loki, batch], exporters: [otlphttp/loki] }
    traces: { receivers: [otlp], processors: [batch], exporters: [otlp/tempo] }
