    newTag: 42f1c6285603b76779a2f19424593c5fbcc1dc92
patches:
  - target: { kind: Deployment, name: smartrail-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: staging
