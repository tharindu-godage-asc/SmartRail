apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartrail-test
resources: [../../base]
images:
  - name: ghcr.io/tharindu-godage-asc/smartrail-api
    newTag: latest
patches:
  - target: { kind: Deployment, name: smartrail-api }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: test
