# In-cluster OpenTelemetry collector. Apps send OTLP here (otel-collector.observability:4317);
# it forwards everything to the local Docker Compose collector on the host, which feeds Prometheus, Loki and Tempo.
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 200 }
      batch: {}
    exporters:
      otlp:
        endpoint: host.docker.internal:4317
        tls: { insecure: true }
    service:
      pipelines:
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp] }
        logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp] }
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{ containerPort: 4317 }, { containerPort: 4318 }]
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
      volumes:
        - { name: config, configMap: { name: otel-collector-config } }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
