apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: smartrail-observability, namespace: argocd }
spec:
  project: default
  source: { repoURL: "https://github.com/tharindu-godage-asc/SmartRail.git", targetRevision: main, path: smartrail-platform/deploy/observability }
  destination: { server: "https://kubernetes.default.svc", namespace: observability }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
