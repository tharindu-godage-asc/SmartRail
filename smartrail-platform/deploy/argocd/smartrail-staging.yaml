apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: smartrail-staging, namespace: argocd }
spec:
  project: default
  source: { repoURL: "https://github.com/tharindu-godage-asc/smartrail.git", targetRevision: main, path: smartrail-platform/deploy/overlays/staging }
  destination: { server: "https://kubernetes.default.svc", namespace: smartrail-staging }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
